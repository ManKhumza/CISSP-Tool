<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102c3a">
<title>CISSP Study Portal — Questions by Sub-Section</title>
<style>
  :root{
    color-scheme:light;
    --navy:#102c3a;--navy-2:#183e4e;--blue:#0d6c82;--blue-l:#e9f5f7;--ink:#182326;
    --ink-2:#526166;--ink-3:#718085;--line:#d9e0df;--line-strong:#bbc9c8;--bg:#f3f1eb;
    --card:#fffefb;--accent:#e3a72f;--accent-l:#fff4d8;--ok:#24734a;--ok-bg:#eaf5ed;
    --bad:#a64038;--bad-bg:#fbecea;--warn:#9a6415;--warn-bg:#fff5df;--mark:#705492;--mark-bg:#f1ebf7;
    --radius:14px;--shadow:0 1px 2px rgba(13,36,45,.05),0 14px 40px rgba(13,36,45,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:88px}
  html,body{min-height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Aptos,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  button,input{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid rgba(227,167,47,.72);outline-offset:2px}
  h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;text-wrap:balance}
  h2,h3,h4{scroll-margin-top:88px}
  .skip-link{position:fixed;left:16px;top:10px;z-index:1000;transform:translateY(-160%);background:var(--accent);
    color:#17272d;padding:9px 14px;border-radius:8px;font-weight:800;text-decoration:none;transition:transform .15s ease}
  .skip-link:focus{transform:translateY(0)}
  #app{display:flex;min-height:100vh}
  #sidebar{width:300px;flex:0 0 300px;background:var(--navy);color:#dce9e8;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#426372 transparent}
  .brand{padding:22px 20px 17px;border-bottom:1px solid rgba(255,255,255,.1);position:relative}
  .brand::before{content:"";display:block;width:34px;height:4px;background:var(--accent);border-radius:99px;margin-bottom:13px}
  .brand h1{margin:0;font-size:20px;line-height:1.2;color:#fff;letter-spacing:-.3px}
  .brand p{margin:6px 0 0;font-size:11px;color:#9eb8be}
  .sidebar-close{display:none;position:absolute;right:14px;top:14px;width:42px;height:42px;border:0;background:rgba(255,255,255,.08);
    border-radius:10px;color:white;cursor:pointer;font-size:22px}
  .sb-progress{padding:15px 20px 13px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sb-progress .row{display:flex;justify-content:space-between;font-size:11px;color:#9eb8be;margin-bottom:7px}
  .sb-progress .row strong{color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
  .sb-bar,.bar,.question-progress{height:7px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden}
  .sb-bar>i,.bar>i,.question-progress>i{display:block;height:100%;background:var(--accent);width:0;border-radius:99px;transition:width .25s ease}
  .sb-actions{display:flex;gap:8px;padding:12px 20px}
  .sb-actions button{flex:1;font-size:11px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.2);
    background:transparent;color:#dce9e8;transition:background-color .15s ease,border-color .15s ease}
  .sb-actions button:first-child{background:var(--accent);border-color:var(--accent);color:#17272d;font-weight:800}
  .sb-actions button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
  .sb-actions button:first-child:hover{background:#f0b943;border-color:#f0b943}
  nav{flex:1;padding:4px 0 28px}
  .nav-h{padding:15px 20px 6px;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#7597a0;font-weight:800}
  .dom{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:#dce9e8;padding:10px 16px 10px 20px;
    cursor:pointer;text-align:left;border-left:3px solid transparent;transition:background-color .15s ease,color .15s ease}
  .dom:hover{background:rgba(255,255,255,.07);color:#fff}.dom.active{background:rgba(255,255,255,.1);border-left-color:var(--accent);color:#fff}
  .dom .caret{flex:0 0 10px;font-size:8px;color:#8eabb2;transition:transform .15s ease}.dom.open .caret{transform:rotate(90deg)}
  .dom .lab{flex:1;min-width:0}.dom .t{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dom .m{display:block;font-size:10.5px;color:#88a7ae;margin-top:2px}.subs{display:none;padding:2px 0 7px}.dom.open+.subs{display:block}
  .sub{display:flex;gap:8px;align-items:baseline;width:100%;border:0;background:transparent;color:#bdd0d4;padding:7px 14px 7px 31px;
    cursor:pointer;text-align:left;font-size:11.5px;border-left:3px solid transparent;transition:background-color .15s ease,color .15s ease}
  .sub:hover{background:rgba(255,255,255,.07);color:#fff}.sub.active{background:rgba(255,255,255,.11);border-left-color:var(--accent);color:#fff}
  .sub .sid{flex:0 0 38px;color:#efc266;font-weight:800;font-size:10.5px}.sub .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub .sc{flex:0 0 auto;font-size:10px;color:#9eb8be;background:rgba(255,255,255,.08);border-radius:99px;padding:1px 6px;font-variant-numeric:tabular-nums}
  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  #topbar{position:sticky;top:0;z-index:20;background:rgba(243,241,235,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(187,201,200,.7);
    padding:12px clamp(14px,3vw,32px);display:flex;gap:10px;align-items:center}
  #mobileMenu{display:none;width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--navy);cursor:pointer;font-size:19px}
  .search-wrap{position:relative;flex:1 1 260px;min-width:180px}.search-wrap::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-53%);color:var(--ink-3);font-size:22px;pointer-events:none}
  #search{width:100%;padding:10px 13px 10px 39px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:var(--card);color:var(--ink)}
  #search:focus-visible{border-color:var(--blue)}
  .top-actions{display:flex;gap:8px;align-items:center}.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:9px 11px;font-size:12px;cursor:pointer;color:var(--ink-2);transition:background-color .15s ease,color .15s ease}
  .seg button:hover{background:#f0f4f3}.seg button.on{background:var(--navy);color:#fff}
  .tb-btn,.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
    transition:border-color .15s ease,background-color .15s ease,color .15s ease,transform .15s ease}
  .tb-btn:hover,.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
  #content{padding:clamp(18px,3vw,38px);max-width:1080px;width:100%;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.pad{padding:clamp(18px,3vw,28px)}
  h2.sec{margin:0 0 6px;font-size:clamp(24px,3vw,34px);line-height:1.15;color:var(--navy);letter-spacing:-.7px}
  h3.sub{margin:24px 0 10px;font-size:17px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:8px}
  .eyebrow{font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}.muted{color:var(--ink-3);font-size:13px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--blue-l);color:var(--blue);margin:0 6px 4px 0}
  .pill.w{background:var(--ok-bg);color:var(--ok)}.pill.g{background:#eff1ef;color:var(--ink-2)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.stat{background:#faf9f5;border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat b{display:block;font:700 25px/1.15 Georgia,serif;color:var(--navy);font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--ink-3)}
  ul.tight{margin:6px 0 0 19px;padding:0}ul.tight li{margin:7px 0}a{color:var(--blue)}
  .hero{overflow:hidden;position:relative;background:linear-gradient(125deg,#fffefb 55%,#edf5f3)}.hero::after{content:"08";position:absolute;right:-12px;top:-50px;
    font:700 180px/1 Georgia,serif;color:rgba(16,44,58,.045);pointer-events:none}.hero-copy{position:relative;z-index:1}.hero p{max-width:660px}.hero .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 22px}.primary-action{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;
    padding:11px 16px;font-weight:800;cursor:pointer;transition:transform .15s ease,background-color .15s ease}.primary-action:hover{background:var(--navy-2);transform:translateY(-1px)}
  .secondary-action{border:1px solid var(--line-strong);background:transparent;color:var(--navy);border-radius:10px;padding:11px 16px;font-weight:750;cursor:pointer}.secondary-action:hover{background:#fff}
  .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:15px;margin-top:15px}.dashboard-grid>.card{height:100%}
  .domain-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.domain-card{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
    background:#faf9f5;border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;transition:border-color .15s ease,transform .15s ease,background-color .15s ease}
  .domain-card:hover{border-color:var(--blue);background:var(--blue-l);transform:translateY(-1px)}.domain-num{display:grid;place-items:center;flex:0 0 36px;height:36px;
    background:var(--navy);color:#fff;border-radius:9px;font-weight:900}.domain-copy{min-width:0;flex:1}.domain-copy strong{display:block;color:var(--navy);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .domain-copy span{display:block;color:var(--ink-3);font-size:10.5px;margin-top:2px}.domain-pct{font-size:11px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
  .guide{background:linear-gradient(155deg,#f8fcfb,#fffefb);border-color:#cddfdd;border-top:4px solid var(--blue)}.guide h3{margin:0 0 8px;font-size:21px;color:var(--navy)}
  .guide .desc{font-size:14px;color:var(--ink-2);margin:0 0 12px}.guide .kn{margin:6px 0 0 20px;padding:0;font-size:13.5px;color:var(--ink-2)}.guide .kn li{margin:7px 0}
  .guide .deep{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:9px}.guide .deep li{padding:11px 13px;background:var(--card);border:1px solid #dce9e6;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
  .terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.term{font-size:11px;background:var(--blue-l);border:1px solid #d2e7e9;color:var(--navy);border-radius:99px;padding:2px 9px}
  .guide details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--navy);margin:10px 0 2px}.guide h4.gh{font-family:inherit;margin:17px 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--ink-3)}
  .guide h4.gh .ghc{background:var(--blue-l);color:var(--navy);border-radius:99px;padding:1px 8px;font-size:11px;letter-spacing:0;margin-left:4px}.guide ul.deep{margin:6px 0 0 20px;padding:0;font-size:13.5px;color:var(--ink-2)}
  .glossary{margin-top:4px;border-top:1px solid #dce9e6}.gitem{display:grid;grid-template-columns:190px 1fr;gap:14px;padding:10px 0;border-bottom:1px dashed #dce5e3}
  .gitem .gt{font-weight:800;color:var(--navy);font-size:13px;line-height:1.4}.gitem .gd{font-size:13px;color:var(--ink-2);line-height:1.55}.gtag{display:inline-block;margin-left:6px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:#eff1ef;color:var(--ink-3);border-radius:99px;padding:1px 6px}.gitem .gsrc{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:2px}
  .seclist{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:12px}.seccard{border:1px solid var(--line);border-radius:11px;background:#faf9f5;padding:14px 15px;cursor:pointer;text-align:left;transition:border-color .15s ease,transform .15s ease,background-color .15s ease}
  .seccard:hover{border-color:var(--blue);background:var(--blue-l);transform:translateY(-1px)}.seccard .sid{font-weight:900;color:var(--blue);font-size:11px}.seccard .st{font-size:13.5px;font-weight:700;color:var(--ink);display:block;margin:3px 0 6px}.seccard .sm{font-size:11px;color:var(--ink-3)}.seccard .bar{height:5px;background:#e4e8e6;margin-top:9px}.seccard .bar>i{background:var(--accent)}
  .qwrap{margin-top:16px;border-top:5px solid var(--accent)}.question-progress{background:#e8e9e4;height:5px;margin:-1px 0 20px}.question-progress>i{background:var(--blue)}
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px}.qhead .num{font-weight:900;color:var(--navy);font-size:15px}.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:#eff1ef;color:var(--ink-2)}.tag.mark{background:var(--mark-bg);color:var(--mark)}
  .qtext{font:700 clamp(17px,2vw,20px)/1.48 Georgia,serif;margin:9px 0 18px;white-space:pre-wrap;max-width:820px}.opts{display:flex;flex-direction:column;gap:9px;margin:0 0 15px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fffefb;border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;font-size:14.5px;line-height:1.5;color:var(--ink);transition:border-color .15s ease,background-color .15s ease,transform .15s ease}
  .opt:hover{border-color:var(--blue);background:var(--blue-l);transform:translateX(2px)}.opt .lt{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:8px;background:#edf0ee;color:var(--navy);font-weight:900;font-size:12px}
  .opt.picked{border-color:var(--blue);background:var(--blue-l)}.opt.correct{border-color:#86bb99;background:var(--ok-bg)}.opt.correct .lt{background:#cfe8d6;color:var(--ok)}.opt.wrong{border-color:#dfa49e;background:var(--bad-bg)}.opt.wrong .lt{background:#f5d1cd;color:var(--bad)}
  .opt[disabled]{cursor:default}.opt[disabled]:hover{transform:none}.opt.correct[disabled]:hover{background:var(--ok-bg);border-color:#86bb99}.opt.wrong[disabled]:hover{background:var(--bad-bg);border-color:#dfa49e}
  .feedback{border-radius:10px;padding:12px 14px;margin:10px 0 0;font-size:14px}.feedback.ok{background:var(--ok-bg);border:1px solid #b9dcc3;color:#155c35}.feedback.no{background:var(--bad-bg);border:1px solid #ecc0bb;color:#842a24}.feedback .ans{font-weight:800}
  .expl{margin-top:14px;border-top:1px dashed var(--line-strong);padding-top:13px}.expl h4{font-family:inherit;margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-3)}.expl .body{font-size:14px;color:var(--ink-2);white-space:pre-wrap}.noexpl{font-size:13px;color:var(--warn);background:var(--warn-bg);border:1px solid #ead5aa;border-radius:9px;padding:10px 12px;margin-top:9px}
  .navbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}.navbar .btn{padding:9px 14px;color:var(--navy);font-weight:800}.navbar .btn[disabled]{opacity:.4;cursor:not-allowed}.jump{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)}.jump input{width:68px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
  .shortcut-hint{margin:12px 0 0;color:var(--ink-3);font-size:11.5px}.kbd{font:10.5px/1 ui-monospace,Consolas,monospace;background:#edf0ee;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--ink-2)}
  .readall .q{margin:0 0 14px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);content-visibility:auto;contain-intrinsic-size:360px}.readall .qn{font-weight:800;color:var(--blue)}.readall .qt{font:700 16px/1.5 Georgia,serif;margin:7px 0 10px;white-space:pre-wrap}.readall .ol{margin:0 0 8px 4px;padding:0;list-style:none}.readall .ol li{margin:4px 0;font-size:14px}.readall .an{font-weight:800;color:var(--ok);font-size:14px;margin:8px 0 4px}.readall .ex{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
  .results{list-style:none;margin:13px 0 0;padding:0}.result-btn{display:block;width:100%;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:8px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);transition:border-color .15s ease,background-color .15s ease}.result-btn:hover{border-color:var(--blue);background:var(--blue-l)}.results .rn{font-size:11px;color:var(--ink-3);margin-bottom:4px}.results .rt{font-size:14px}mark{background:#ffe59b;padding:0 2px}.empty{padding:32px;text-align:center;color:var(--ink-3)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);background:var(--navy);color:#fff;padding:10px 17px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(5,22,29,.45);z-index:29;border:0}
  @media (max-width:900px){
    #mobileMenu{display:block}#sidebar{position:fixed;z-index:30;left:0;top:0;transform:translateX(-105%);transition:transform .22s ease;box-shadow:20px 0 60px rgba(3,20,27,.25)}
    body.nav-open #sidebar{transform:translateX(0)}body.nav-open .sidebar-scrim{display:block}.sidebar-close{display:block}#topbar{flex-wrap:wrap}.top-actions{margin-left:auto}
    #content{padding:18px}.dashboard-grid{grid-template-columns:1fr}.domain-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:620px){
    #topbar{gap:8px}.search-wrap{order:3;flex-basis:100%}.seg{display:none}.tb-btn#btnPrint{display:none}.tb-btn{padding:9px}.domain-grid{grid-template-columns:1fr}
    .gitem{grid-template-columns:1fr;gap:3px}.seclist{grid-template-columns:1fr}.hero .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.navbar{align-items:stretch}.navbar>div{flex:1}.navbar .btn{flex:1}.jump{flex-basis:100%}.shortcut-hint{display:none}
    .qhead .muted{flex-basis:100%}.hero::after{font-size:120px}.pad{padding:18px}.qtext{font-size:17px}.opt{padding:12px}.guide .glossary{max-height:560px;overflow:auto}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  @media print{
    #sidebar,#topbar,.navbar,.sb-actions,.sidebar-scrim{display:none!important}
    #content{max-width:none;padding:0}
    .card,.seccard{box-shadow:none}
    .readall .q{break-inside:avoid}
    body{background:#fff}
  }
</style>
</head>
<body>
<a class="skip-link" href="#content">Skip to study content</a>
<div id="app">
  <aside id="sidebar" aria-label="Study navigation">
    <div class="brand">
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close study navigation">×</button>
      <h1>CISSP Study Portal</h1>
      <p id="brandSub">Loading…</p>
    </div>
    <div class="sb-progress">
      <div class="row"><span>Overall progress</span><strong id="pctText">0%</strong></div>
      <div class="sb-bar" role="progressbar" aria-label="Overall study progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pctBar"></i></div>
      <div class="row" style="margin-top:7px"><span id="answeredText">0 answered</span><span id="marksText">0 marked</span></div>
    </div>
    <div class="sb-actions">
      <button id="btnResume">Resume</button>
      <button id="btnReset">Reset</button>
    </div>
    <nav id="domainNav"></nav>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="mobileMenu" type="button" aria-label="Open study navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
      <label class="search-wrap"><span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Search all questions</span>
        <input id="search" name="question-search" type="search" placeholder="Search questions…" autocomplete="off">
      </label>
      <div class="top-actions">
      <div class="seg" role="group" aria-label="Question layout">
        <button type="button" data-layout="one" class="on" aria-pressed="true">Practice</button>
        <button type="button" data-layout="all" aria-pressed="false">Read</button>
      </div>
      <button class="tb-btn" type="button" id="btnGuide">Guide</button>
      <button class="tb-btn" type="button" id="btnPrint">Print</button>
      </div>
    </header>
    <div id="content" tabindex="-1"></div>
  </main>
</div>
<button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="Close study navigation"></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="cissp-data.js" charset="utf-8"></script>
<script>
"use strict";
(function(){
  var DATA = window.CISSP_DATA;
  if(!DATA){ document.getElementById('content').innerHTML =
    '<div class="empty">Could not load <code>cissp-data.js</code>. Keep it beside this page.</div>'; return; }

  var KEY = 'cissp-portal-v1';
  var progress = load();
  var state = { view:'home', domainId:1, sectionId:null, index:0, layout:'one', query:'',
                showGuide:true, glossQuery:'' };

  /* ------------- models ------------- */
  function normSection(d, s){
    return { id:s.id, title:s.title, count:s.count, guide:s.guide, questions:s.questions,
             domainId:d.id, domainName:d.name, virtual:false };
  }
  function generalSection(d){
    if(!d.general || !d.general.count) return null;
    return { id:'general', title:'Other topics in this domain', count:d.general.count,
             guide:{ focus:'Questions in this domain that could not be confidently attributed to a single '+
                            'official sub-section. They are still worth reviewing — read the explanations.',
                     mustKnow:[], keyTerms:[] },
             questions:d.general.questions, domainId:d.id, domainName:d.name, virtual:true };
  }
  var DOMAINS = {};
  DATA.domains.forEach(function(d){
    var secs = d.sections.map(function(s){ return normSection(d, s); });
    var g = generalSection(d);
    if(g) secs.push(g);
    DOMAINS[d.id] = { d:d, sections:secs };
  });
  function dom(id){ return DOMAINS[id] || DOMAINS[DATA.domains[0].id]; }
  function section(domId, sid){
    var list = dom(domId).sections;
    for(var i=0;i<list.length;i++) if(list[i].id === sid) return list[i];
    return list[0];
  }
  var ALL = [];
  DATA.domains.forEach(function(d){
    d.sections.forEach(function(s){
      s.questions.forEach(function(q){ ALL.push({ d:d, s:s, q:q }); });
    });
    if(d.general) d.general.questions.forEach(function(q){
      ALL.push({ d:d, s:{id:'general', title:'Other topics'}, q:q });
    });
  });
  var INDEX = {};
  ALL.forEach(function(it, i){ INDEX[it.q.n] = i; });

  /* ------------- progress ------------- */
  function load(){
    try{ var raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
    return { answers:{}, marks:{}, sections:{} };
  }
  function normalize(p){ p = p||{}; p.answers=p.answers||{}; p.marks=p.marks||{}; p.sections=p.sections||{}; return p; }
  var memOnly = false;
  function save(){ if(memOnly) return; try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){ memOnly = true; } }

  function stats(qs){
    var a=0,m=0;
    qs.forEach(function(q){ if(progress.answers[q.n]) a++; if(progress.marks[q.n]) m++; });
    return { answered:a, marks:m, total:qs.length };
  }
  function overall(){
    var a=0,m=0,t=0,c=0;
    DATA.domains.forEach(function(d){
      var qs=[]; d.sections.forEach(function(s){ qs=qs.concat(s.questions); });
      if(d.general) qs=qs.concat(d.general.questions);
      var st=stats(qs); a+=st.answered; m+=st.marks; t+=st.total;
    });
    Object.keys(progress.answers).forEach(function(k){ if(progress.answers[k].correct) c++; });
    return { answered:a, marks:m, total:t, correct:c, accuracy:a?pct(c,a):0 };
  }

  /* ------------- helpers ------------- */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function byId(i){ return document.getElementById(i); }
  function toast(msg){ var t=byId('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1500); }
  function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
  function markAnswered(qn, picked, correct){
    progress.answers[qn] = { picked:picked, correct:correct, ts:Date.now() };
    save(); refreshSidebar();
  }

  /* ------------- sidebar ------------- */
  function buildSidebar(){
    var h = '<div class="nav-h">Overview</div>' +
      '<button type="button" class="dom" data-home="1"><span class="caret" style="visibility:hidden">▶</span>' +
      '<span class="lab"><span class="t">Exam overview &amp; study plan</span>' +
      '<span class="m">Strategy, weights and tips</span></span></button>';
    DATA.domains.forEach(function(d){
      h += '<button type="button" class="dom" data-dom="'+d.id+'" aria-expanded="false"><span class="caret" aria-hidden="true">▶</span><span class="lab">' +
        '<span class="t">Domain '+d.id+': '+esc(d.name)+'</span>' +
        '<span class="m">'+d.weight+' · '+d.count+' questions · '+d.sections.length+' sub-sections</span>' +
        '</span></button><div class="subs" data-subs="'+d.id+'">';
      d.sections.forEach(function(s){
        h += '<button type="button" class="sub" data-sec="'+s.id+'" data-dom="'+d.id+'">' +
          '<span class="sid">'+s.id+'</span><span class="st" title="'+esc(s.title)+'">'+esc(s.title)+'</span>' +
          '<span class="sc" data-scc="'+d.id+'-'+s.id+'">'+s.count+'</span></button>';
      });
      if(d.general && d.general.count){
        h += '<button type="button" class="sub" data-sec="general" data-dom="'+d.id+'">' +
          '<span class="sid" style="color:#c9a86a">—</span><span class="st">Other topics</span>' +
          '<span class="sc">'+d.general.count+'</span></button>';
      }
      h += '</div>';
    });
    h += '<div class="nav-h">Revision</div>' +
      '<button type="button" class="dom" data-gloss="1"><span class="caret" style="visibility:hidden">▶</span>' +
      '<span class="lab"><span class="t">Key terms &amp; meanings (A–Z)</span>' +
      '<span class="m" id="glossCount">All defined terms</span></span></button>';
    byId('domainNav').innerHTML = h;
    byId('domainNav').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      if(b.dataset.home){ go({view:'home'}); return; }
      if(b.dataset.gloss){ go({view:'glossary'}); return; }
      if(b.dataset.sec){ go({view:'section', domainId:parseInt(b.dataset.dom,10),
                             sectionId:b.dataset.sec, index:0, showGuide:true}); return; }
      if(b.dataset.dom){
        var did = parseInt(b.dataset.dom,10);
        openDomain(did);
        go({view:'domain', domainId:did});
      }
    });
  }
  function openDomain(id){
    document.querySelectorAll('.dom').forEach(function(el){
      var on = parseInt(el.dataset.dom,10) === id;
      el.classList.toggle('open', on);
      if(el.dataset.dom) el.setAttribute('aria-expanded', on ? 'true' : 'false');
    });
  }
  function refreshSidebar(){
    var o = overall();
    byId('pctText').textContent = pct(o.answered, o.total) + '%';
    byId('pctBar').style.width = pct(o.answered, o.total) + '%';
    document.querySelector('.sb-bar').setAttribute('aria-valuenow', pct(o.answered, o.total));
    byId('answeredText').textContent = o.answered.toLocaleString() + ' answered';
    byId('marksText').textContent = o.marks.toLocaleString() + ' marked';
    byId('brandSub').textContent = DATA.meta.total.toLocaleString() + ' questions · ' +
      DATA.meta.subsections + ' sub-sections';
    var gc = byId('glossCount');
    if(gc) gc.textContent = glossaryAll().length.toLocaleString() + ' defined terms';
    DATA.domains.forEach(function(d){
      d.sections.forEach(function(s){
        var el = document.querySelector('[data-scc="'+d.id+'-'+s.id+'"]');
        if(!el) return;
        var st = stats(s.questions);
        el.textContent = st.total + (st.answered ? ' · ' + st.answered + '✓' : '');
      });
    });
    document.querySelectorAll('.dom').forEach(function(el){
      el.classList.toggle('active', (state.view === 'domain' || state.view === 'section') && parseInt(el.dataset.dom,10) === state.domainId);
    });
    document.querySelectorAll('.sub').forEach(function(el){
      el.classList.toggle('active', state.view === 'section' &&
        parseInt(el.dataset.dom,10) === state.domainId && el.dataset.sec === state.sectionId);
    });
  }

  /* ------------- navigation ------------- */
  function closeNav(){ document.body.classList.remove('nav-open'); byId('mobileMenu').setAttribute('aria-expanded','false'); }
  function go(patch){ Object.keys(patch).forEach(function(k){ state[k]=patch[k]; }); render(); closeNav();
    window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
  function openQuestion(qn){
    var it = ALL[INDEX[qn]]; if(!it) return;
    var sid = it.s.id; var idx = 0;
    for(var i=0;i<it.s.questions.length;i++) if(it.s.questions[i].n === qn) idx = i;
    openDomain(it.d.id);
    go({ view:'section', domainId:it.d.id, sectionId:sid, index:idx, showGuide:false });
  }
  function resumeStudy(){
    var best=null;
    ALL.forEach(function(it){
      var r=progress.answers[it.q.n];
      if(r && (!best || r.ts>best.ts)) best={ts:r.ts,it:it};
    });
    if(best) openQuestion(best.it.q.n);
    else { var id=DATA.domains[0].id; openDomain(id); go({view:'domain', domainId:id}); }
  }

  /* ------------- render ------------- */
  function render(){
    refreshSidebar();
    var c = byId('content');
    if(state.view === 'home') c.innerHTML = viewHome();
    else if(state.view === 'search') c.innerHTML = viewSearch();
    else if(state.view === 'domain') c.innerHTML = viewDomain();
    else if(state.view === 'glossary') c.innerHTML = viewGlossary();
    else c.innerHTML = (state.layout === 'all') ? viewReadAll() : viewSection();
    document.querySelectorAll('.seg button').forEach(function(b){
      var on=b.dataset.layout===state.layout; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
    });
    var guideVisible = state.view === 'section' && state.showGuide;
    byId('btnGuide').textContent = guideVisible ? 'Hide Guide' : 'Study Guide';
    byId('btnGuide').setAttribute('aria-pressed', guideVisible ? 'true' : 'false');
    wire();
  }

  /* ------------- global A-Z glossary ------------- */
  var GLOSSARY_ALL = null;
  function glossaryAll(){
    if(GLOSSARY_ALL) return GLOSSARY_ALL;
    var out = [];
    DATA.domains.forEach(function(d){
      d.sections.forEach(function(s){
        (s.guide.glossary||[]).forEach(function(x){
          out.push({t:x.t, d:x.d, k:x.k, sid:s.id, title:s.title, dom:d.id});
        });
      });
    });
    out.sort(function(a,b){ return a.t.toLowerCase() < b.t.toLowerCase() ? -1 : 1; });
    GLOSSARY_ALL = out;
    return out;
  }

  function viewGlossary(){
    var all = glossaryAll();
    var q = (state.glossQuery||'').trim().toLowerCase();
    var rows = q ? all.filter(function(x){
        return x.t.toLowerCase().indexOf(q) >= 0 || x.d.toLowerCase().indexOf(q) >= 0;
      }) : all;
    var groups = {}, order = [];
    rows.forEach(function(x){
      var L = x.t[0].toUpperCase().replace(/[^A-Z]/, '#');
      if(!groups[L]){ groups[L] = []; order.push(L); }
      groups[L].push(x);
    });
    order.sort();
    var body = order.map(function(L){
      return '<h3 class="sub" style="margin-top:16px">'+L+'</h3>' +
        groups[L].map(function(x){
          var tag = x.k === 'ctx' ? ' <span class="gtag">context</span>' : '';
          return '<div class="gitem"><div class="gt">'+esc(x.t)+tag+
            '<div class="gsrc">'+esc(x.sid)+'</div></div>' +
            '<div class="gd">'+esc(x.d)+
            ' <button class="tb-btn jumpsec" data-gsec="'+x.sid+'" data-gdom="'+x.dom+
            '" style="font-size:11px;padding:2px 7px;margin-left:6px">study '+esc(x.sid)+'</button></div></div>';
        }).join('');
    }).join('');
    return '<div class="card pad"><h2 class="sec">Key terms &amp; meanings</h2>' +
      '<p class="muted">'+all.length.toLocaleString()+' terms defined across the 61 sub-sections, ' +
      'mined from the ISC2 study guide, the exam companion and this question bank\'s explanations. ' +
      'Words marked <span class="gtag">context</span> are explained by the sentence that uses them.</p>' +
      '<label for="glossFilter" class="muted" style="display:block;margin-top:12px">Filter glossary</label>' +
      '<input id="glossFilter" name="glossary-filter" type="search" autocomplete="off" placeholder="Try “encryption”…" value="'+esc(state.glossQuery||'')+
      '" style="margin-top:10px;width:100%;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px">' +
      '<p class="muted" style="margin-top:8px">'+rows.length.toLocaleString()+' shown</p></div>' +
      (rows.length ? '<div class="card pad" style="margin-top:14px">'+body+'</div>'
                   : '<div class="empty">No terms match that filter.</div>');
  }

  function viewHome(){
    var sg = DATA.studyGuide, o = overall();
    var recent = null;
    ALL.forEach(function(it){
      var r=progress.answers[it.q.n];
      if(r && (!recent || r.ts>recent.ts)) recent={ts:r.ts,it:it};
    });
    var cards = DATA.domains.map(function(d){
      var qs=[]; d.sections.forEach(function(s){ qs=qs.concat(s.questions); });
      if(d.general) qs=qs.concat(d.general.questions);
      var st = stats(qs);
      return '<button type="button" class="domain-card" data-open="'+d.id+'">' +
        '<span class="domain-num">'+d.id+'</span><span class="domain-copy"><strong>'+esc(d.name)+'</strong>' +
        '<span>'+d.weight+' of exam · '+st.answered+' of '+st.total+' answered</span></span>' +
        '<span class="domain-pct">'+pct(st.answered,st.total)+'%</span></button>';
    }).join('');
    var nextLabel = recent ? 'Continue Question '+recent.it.q.n : 'Start With Domain 1';
    return '<section class="card pad hero" aria-labelledby="homeTitle"><div class="hero-copy">' +
      '<div class="eyebrow">Your CISSP study desk</div><h2 class="sec" id="homeTitle">Prepare with purpose.</h2>' +
      '<p class="muted">Work through '+DATA.meta.total.toLocaleString()+' practice questions mapped to all '+DATA.meta.subsections+
      ' official sub-sections. Learn the concept, answer the question, then use the explanation to close the gap.</p>' +
      '<div class="hero-actions"><button type="button" class="primary-action" data-resume="1">'+nextLabel+'</button>' +
      '<button type="button" class="secondary-action" data-open="1">Browse Domain 1</button></div>' +
      '<div class="grid"><div class="stat"><b>'+pct(o.answered,o.total)+'%</b><span>Syllabus progress</span></div>' +
      '<div class="stat"><b>'+o.answered.toLocaleString()+'</b><span>Questions answered</span></div>' +
      '<div class="stat"><b>'+(o.answered?o.accuracy+'%':'—')+'</b><span>Accuracy so far</span></div>' +
      '<div class="stat"><b>'+o.marks.toLocaleString()+'</b><span>Marked to revisit</span></div></div></div></section>' +
      '<div class="dashboard-grid"><section class="card pad" aria-labelledby="domainsTitle"><div class="eyebrow">Exam map</div>' +
      '<h3 class="sub" id="domainsTitle" style="margin-top:0">Choose a Domain</h3><div class="domain-grid">'+cards+'</div></section>' +
      '<aside class="card pad"><div class="eyebrow">Recommended focus</div><h3 class="sub" style="margin-top:0">Study Smarter</h3>' +
      '<p class="muted">Prioritize high-weight domains, but keep your practice broad—the adaptive exam looks for consistent competence.</p>' +
      '<div class="stat"><b style="font-size:16px">High Weight</b><span>'+esc(sg.priority['High weight'].join(' · '))+'</span></div>' +
      '<div class="stat" style="margin-top:9px"><b style="font-size:16px">Medium Weight</b><span>'+esc(sg.priority['Medium weight'].join(' · '))+'</span></div></aside></div>' +
      '<details class="card pad" style="margin-top:15px"><summary style="cursor:pointer;font-weight:800;color:var(--navy)">Study strategy, exam technique &amp; resources</summary>' +
      '<h3 class="sub">Study Strategy</h3><ul class="tight">'+sg.strategy.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>' +
      '<h3 class="sub">Exam Technique</h3><ul class="tight">'+sg.tips.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>' +
      '<h3 class="sub">On Exam Day</h3><ul class="tight">'+sg.examDay.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>' +
      '<h3 class="sub">Recommended Resources</h3><ul class="tight">'+sg.resources.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></details>';
  }

  function guideHTML(sec){
    if(!sec.guide) return '';
    var g = sec.guide;
    var st = stats(sec.questions);
    var kn = (g.mustKnow||[]).map(function(k){ return '<li>'+esc(k)+'</li>'; }).join('');
    var deep = (g.deepNotes||[]).map(function(k){ return '<li>'+esc(k)+'</li>'; }).join('');
    var gl = (g.glossary||[]);
    var gloss = gl.map(function(x){
      var tag = x.k === 'ctx' ? '<span class="gtag" title="meaning in context from the study material">context</span>' : '';
      return '<div class="gitem"><div class="gt">'+esc(x.t)+tag+'</div>' +
             '<div class="gd">'+esc(x.d)+'</div></div>';
    }).join('');
    var bare = (g.bareTerms||[]).map(function(t){ return '<span class="term">'+esc(t)+'</span>'; }).join('');
    return '<div class="card pad guide">' +
      '<h3>'+ (sec.virtual ? 'Other topics' : sec.id + ' — ' + esc(sec.title)) +'</h3>' +
      (sec.virtual ? '' : '<div style="margin-bottom:7px">' +
        '<span class="pill">Domain '+sec.domainId+'</span>' +
        '<span class="pill g">'+sec.count+' questions</span>' +
        '<span class="pill w">'+st.answered+' answered</span>' +
        (gl.length ? '<span class="pill">'+gl.length+' key terms</span>' : '') +
        (st.marks ? '<span class="pill">'+st.marks+' marked</span>' : '') + '</div>') +
      '<p class="desc">'+esc(g.focus)+'</p>' +
      (kn ? '<h4 class="gh">Must know</h4><ul class="kn">'+kn+'</ul>' : '') +
      (deep ? '<h4 class="gh">Deeper lesson notes</h4><ul class="deep">'+deep+'</ul>' : '') +
      (gloss ? '<h4 class="gh">Key terms &amp; meanings <span class="ghc">'+gl.length+'</span></h4>' +
               '<div class="glossary">'+gloss+'</div>' : '') +
      (bare ? '<details style="margin-top:10px"><summary>Also know these terms ('+
               (g.bareTerms||[]).length+')</summary><div class="terms">'+bare+'</div></details>' : '') +
      '</div>';
  }

  function viewDomain(){
    var dd = dom(state.domainId), d = dd.d;
    var qs=[]; dd.sections.forEach(function(s){ qs=qs.concat(s.questions); });
    var st = stats(qs);
    var cards = dd.sections.map(function(s){
      var sst = stats(s.questions);
      var vt = s.virtual ? '<span class="pill g">other</span>' : '';
      return '<button type="button" class="seccard" data-opensec="'+s.id+'">' +
        '<span class="sid">'+(s.virtual ? '—' : s.id)+'</span> '+vt+
        '<span class="st">'+esc(s.title)+'</span>' +
        '<span class="sm">'+s.count+' questions · '+sst.answered+' answered'+
          (sst.marks ? ' · '+sst.marks+' marked' : '')+'</span>' +
        '<span class="bar"><i style="width:'+pct(sst.answered,sst.total)+'%"></i></span></button>';
    }).join('');
    return '<div class="card pad"><h2 class="sec">Domain '+d.id+': '+esc(d.name)+'</h2>' +
      '<div style="margin:8px 0"><span class="pill w">Exam weight '+d.weight+'</span>' +
      '<span class="pill">'+d.count+' questions</span>' +
      '<span class="pill">'+d.sections.length+' sub-sections</span>' +
      '<span class="pill">'+st.answered+' answered</span></div>' +
      '<p class="muted">'+esc(d.description)+'</p>' +
      '<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;color:#12405f">' +
        'Key topics to revise in this domain</summary><ul class="tight">' +
        d.keyTopics.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('') + '</ul></details>' +
      '<h3 class="sub">Sub-sections — click to study only its questions</h3>' +
      '<div class="seclist">'+cards+'</div>' +
      '<div style="margin-top:14px"><button class="tb-btn" data-openall="1">Read all '+d.count+
        ' questions in this domain (document view)</button></div></div>';
  }

  function currentSec(){ return section(state.domainId, state.sectionId || dom(state.domainId).sections[0].id); }

  function optionsHTML(q, reveal, picked){
    if(!q.o || !q.o.length) return '<div class="noexpl">No answer options could be extracted for this question.</div>';
    return '<div class="opts">' + q.o.map(function(o){
      var cls='opt';
      if(reveal){ if(o[0]===q.a) cls+=' correct'; else if(picked && o[0]===picked) cls+=' wrong'; }
      else if(picked && o[0]===picked){ cls+=' picked'; }
      return '<button class="'+cls+'" data-opt="'+o[0]+'"'+(reveal?' disabled':'')+'>' +
             '<span class="lt">'+o[0]+'</span><span>'+esc(o[1])+'</span></button>';
    }).join('') + '</div>';
  }
  function explanationHTML(q){
    if(q.e) return '<div class="expl"><h4>Explanation</h4><div class="body">'+esc(q.e)+'</div></div>';
    return '<div class="noexpl">No explanation was included for this question in the source material. ' +
           'Answer: <b>'+esc(q.a||'—')+'</b>.</div>';
  }
  function feedbackHTML(q, picked){
    if(!picked) return '';
    var ok = picked === q.a;
    return '<div class="feedback '+(ok?'ok':'no')+'" role="status">' + (ok ? 'Correct.' : 'Not quite — that is not the best answer.') +
      ' <span class="ans">Correct answer: '+esc(q.a||'—')+'</span>' +
      (ok ? '' : ' (you chose '+esc(picked)+')') + '</div>';
  }

  function viewSection(){
    var sec = currentSec();
    var n = sec.questions.length;
    if(!n) return guideHTML(sec) + '<div class="card pad empty" style="margin-top:14px">' +
      'No questions are filed under this sub-section in this bank.</div>';
    if(state.index >= n) state.index = n-1;
    if(state.index < 0) state.index = 0;
    var q = sec.questions[state.index];
    var rec = progress.answers[q.n];
    var reveal = !!(rec && rec.picked) || !!progress.marks[q.n + '_reveal'];
    var picked = rec ? rec.picked : null;
    var marked = !!progress.marks[q.n];
    var head = state.showGuide ? guideHTML(sec) : '';
    return head +
    '<div class="card pad qwrap">' +
      '<div class="question-progress" role="progressbar" aria-label="Section progress" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+(state.index+1)+'"><i style="width:'+pct(state.index+1,n)+'%"></i></div>' +
      '<div class="qhead"><span class="num">Question '+q.n+'</span>' +
        '<span class="tag">'+(sec.virtual?'Other topics':sec.id)+'</span>' +
        '<span class="tag">Domain '+sec.domainId+'</span>' +
        (marked ? '<span class="tag mark">Marked</span>' : '') +
        '<span style="flex:1"></span><span class="muted">'+(state.index+1)+' of '+n+'</span></div>' +
      '<div class="qtext" id="questionText">'+esc(q.q)+'</div>' +
      optionsHTML(q, reveal, picked) +
      (reveal ? feedbackHTML(q, picked) + explanationHTML(q) : '') +
      '<div class="navbar"><div style="display:flex;gap:8px">' +
        '<button class="btn" id="btnPrev"'+(state.index===0?' disabled':'')+'>&larr; Previous</button>' +
        '<button class="btn" id="btnNext"'+(state.index===n-1?' disabled':'')+'>Next &rarr;</button></div>' +
        '<div style="display:flex;gap:8px">' +
        (reveal ? '' : '<button class="btn" id="btnReveal">Show answer</button>') +
        '<button class="btn" id="btnMark">'+(marked?'Unmark':'Mark for review')+'</button></div>' +
        '<div class="jump"><label for="jumpInput">Go to</label><input id="jumpInput" name="question-number" aria-label="Question number in this section" inputmode="numeric" type="number" min="1" max="'+n+'">' +
        '<button type="button" class="btn" id="btnJump">Go</button></div></div>' +
      '<p class="shortcut-hint"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> navigate · ' +
        '<span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">s</span> show · ' +
        '<span class="kbd">m</span> mark · <span class="kbd">g</span> guide</p>' +
    '</div>';
  }

  function viewReadAll(){
    var sec = currentSec();
    var blocks = sec.questions.map(function(q){
      var opts = (q.o||[]).map(function(o){ return '<li><b>'+o[0]+'.</b> '+esc(o[1])+'</li>'; }).join('');
      return '<div class="q"><div class="qn">Question '+q.n+'</div>' +
        '<div class="qt">'+esc(q.q)+'</div><ul class="ol">'+opts+'</ul>' +
        '<div class="an">Answer: '+esc(q.a||'—')+'</div>' +
        (q.e ? '<div class="ex">'+esc(q.e)+'</div>' : '<div class="noexpl">No explanation in the source material.</div>') +
        '</div>';
    }).join('');
    return guideHTML(sec) +
      '<div class="card pad" style="margin-top:14px"><h3 class="sub" style="margin-top:0">'+
      (sec.virtual?'Other topics':sec.id+' — '+esc(sec.title))+' · document view</h3>' +
      '<p class="muted">All '+sec.questions.length+' questions in this sub-section with options, answers and explanations.</p></div>' +
      '<div class="readall" style="margin-top:14px">'+blocks+'</div>';
  }

  function viewSearch(){
    var q = state.query.trim().toLowerCase();
    if(q.length < 2) return '<div class="card pad"><h2 class="sec">Search</h2><p class="muted">Type at least two characters.</p></div>';
    var hits = [];
    for(var i=0;i<ALL.length && hits.length<400;i++){
      var it = ALL[i];
      var t = it.q.q.toLowerCase(), e = (it.q.e||'').toLowerCase();
      if(t.indexOf(q) >= 0 || e.indexOf(q) >= 0) hits.push(it);
    }
    var list = hits.map(function(it){
      var txt = it.q.q, pos = txt.toLowerCase().indexOf(q), snip = txt;
      if(pos > 70) snip = '…' + txt.slice(pos-60);
      snip = esc(snip.slice(0,220));
      var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
      snip = snip.replace(re,'<mark>$1</mark>');
      return '<li><button type="button" class="result-btn" data-q="'+it.q.n+'"><div class="rn">Question '+it.q.n+' · Domain '+it.d.id+
        ' · '+(it.s.id==='general'?'Other topics':it.s.id)+' — '+esc(it.s.title)+'</div>' +
        '<div class="rt">'+snip+'</div></button></li>';
    }).join('');
    return '<div class="card pad"><h2 class="sec">Search results</h2><p class="muted">'+hits.length+
      (hits.length===400?'+':'')+' match'+(hits.length===1?'':'es')+' for “'+esc(state.query)+
      '”. Click to open.</p></div>' +
      (hits.length ? '<ul class="results">'+list+'</ul>' : '<div class="empty">No questions matched.</div>');
  }

  /* ------------- wiring ------------- */
  function wire(){
    var c = byId('content');
    c.querySelectorAll('[data-open]').forEach(function(b){
      b.onclick = function(){ var id=parseInt(b.dataset.open,10); openDomain(id); go({view:'domain',domainId:id}); };
    });
    c.querySelectorAll('[data-resume]').forEach(function(b){ b.onclick=resumeStudy; });
    // global glossary: filter + jump-to-section
    var gf = byId('glossFilter');
    if(gf){
      gf.oninput = function(){ state.glossQuery = gf.value; render(); var n = byId('glossFilter');
        if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
    }
    c.querySelectorAll('[data-gsec]').forEach(function(b){
      b.onclick = function(){
        var did = parseInt(b.dataset.gdom,10);
        openDomain(did);
        go({view:'section', domainId:did, sectionId:b.dataset.gsec, index:0, showGuide:true});
      };
    });
    c.querySelectorAll('[data-opensec]').forEach(function(b){
      b.onclick = function(){ go({view:'section', domainId:state.domainId, sectionId:b.dataset.opensec, index:0, showGuide:true}); };
    });
    c.querySelectorAll('[data-openall]').forEach(function(b){
      b.onclick = function(){
        state.layout='all';
        document.querySelectorAll('.seg button').forEach(function(x){ x.classList.toggle('on', x.dataset.layout==='all'); });
        var first = dom(state.domainId).sections[0].id;
        go({view:'section', sectionId:first, index:0});
      };
    });
    c.querySelectorAll('.result-btn').forEach(function(b){
      b.onclick = function(){ openQuestion(parseInt(b.dataset.q,10)); };
    });
    if(state.view === 'section'){
      var sec = currentSec();
      var q = sec.questions[state.index];
      if(q){
        c.querySelectorAll('.opt').forEach(function(b){
          b.onclick = function(){
            if(b.disabled) return;
            var p = b.dataset.opt;
            markAnswered(q.n, p, p === q.a);
            render();
          };
        });
      }
      var bp=byId('btnPrev'), bn=byId('btnNext');
      if(bp) bp.onclick=function(){ go({index:state.index-1}); };
      if(bn) bn.onclick=function(){ go({index:state.index+1}); };
      var br=byId('btnReveal');
      if(br) br.onclick=function(){ progress.marks[q.n+'_reveal']=true; save(); render(); };
      var bm=byId('btnMark');
      if(bm) bm.onclick=function(){
        if(progress.marks[q.n]) delete progress.marks[q.n]; else progress.marks[q.n]=true;
        save(); render(); toast(progress.marks[q.n]?'Marked for review':'Mark removed');
      };
      var bj=byId('btnJump');
      if(bj) bj.onclick=function(){
        var v=parseInt(byId('jumpInput').value,10);
        if(!isNaN(v)) go({index:Math.min(Math.max(v,1),sec.questions.length)-1});
      };
      var ji=byId('jumpInput');
      if(ji) ji.onkeydown=function(e){ if(e.key==='Enter') bj.click(); };
    }
  }

  /* ------------- top bar ------------- */
  byId('search').addEventListener('input', function(e){
    var v=e.target.value;
    if(v.trim().length>=2){ state.query=v; state.view='search'; render(); }
    else if(state.view==='search'){ go({view:'section'}); }
  });
  byId('search').addEventListener('keydown', function(e){
    if(e.key==='Escape'){ e.target.value=''; go({view:'section'}); }
  });
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.seg button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      state.layout=b.dataset.layout;
      if(state.view!=='section') state.view = state.view==='search' ? 'search' : 'section';
      render();
    });
  });
  byId('btnGuide').onclick=function(){
    state.showGuide=!state.showGuide;
    if(state.view!=='section') state.view='section';
    render();
  };
  byId('btnPrint').onclick=function(){ window.print(); };
  byId('btnResume').onclick=function(){
    resumeStudy();
  };
  byId('mobileMenu').onclick=function(){
    var open=!document.body.classList.contains('nav-open');
    document.body.classList.toggle('nav-open',open);
    byId('mobileMenu').setAttribute('aria-expanded',open?'true':'false');
    if(open) byId('sidebarClose').focus();
  };
  byId('sidebarClose').onclick=closeNav;
  byId('sidebarScrim').onclick=closeNav;
  byId('btnReset').onclick=function(){
    if(!confirm('Clear all saved answers, marks and checklist ticks?')) return;
    progress={answers:{},marks:{},sections:{}}; save(); render(); toast('Progress cleared');
  };

  /* ------------- keyboard ------------- */
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && document.body.classList.contains('nav-open')){ closeNav(); byId('mobileMenu').focus(); return; }
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea') return;
    if(e.key==='/'){ e.preventDefault(); byId('search').focus(); return; }
    if(state.view!=='section'||state.layout!=='one') return;
    var sec=currentSec(), q=sec.questions[state.index]; if(!q) return;
    if(e.key==='ArrowRight'){ if(state.index<sec.questions.length-1) go({index:state.index+1}); }
    else if(e.key==='ArrowLeft'){ if(state.index>0) go({index:state.index-1}); }
    else if(e.key==='s'||e.key==='S'){ progress.marks[q.n+'_reveal']=true; save(); render(); }
    else if(e.key==='m'||e.key==='M'){
      if(progress.marks[q.n]) delete progress.marks[q.n]; else progress.marks[q.n]=true;
      save(); render(); toast(progress.marks[q.n]?'Marked for review':'Mark removed');
    }
    else if(e.key==='g'||e.key==='G'){ state.showGuide=!state.showGuide; render(); }
    else if(/^[1-5]$/.test(e.key)){
      var L=String.fromCharCode(64+parseInt(e.key,10));
      if((q.o||[]).some(function(o){return o[0]===L;})){ markAnswered(q.n,L,L===q.a); render(); }
    }
  });

  /* ------------- boot ------------- */
  buildSidebar();
  state.sectionId = dom(DATA.domains[0].id).sections[0].id;
  refreshSidebar();
  render();
})();
</script>
</body>
</html>
